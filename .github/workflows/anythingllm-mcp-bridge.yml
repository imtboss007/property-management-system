name: AnythingLLM MCP bridge checks
on:
  push:
    branches: ["feature/anythingllm-chatgpt-mcp-bridge"]
    paths:
      - "anythingllm-mcp-bridge/**"
      - ".github/workflows/anythingllm-mcp-bridge.yml"
  pull_request:
    paths:
      - "anythingllm-mcp-bridge/**"
      - ".github/workflows/anythingllm-mcp-bridge.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anythingllm-mcp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: anythingllm-mcp-bridge/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm install --ignore-scripts
      - run: npm run check
