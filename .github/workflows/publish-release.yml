name: AXIVESTRA Publish Release

on:
  workflow_run:
    workflows:
      - AXIVESTRA Windows and Android builds
    types:
      - completed

permissions:
  actions: read
  contents: write

jobs:
  publish-release:
    name: Publish tested Windows and Android installers
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact source that produced the packages
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          pattern: AXIVESTRA-Setup-*-x64.exe
          merge-multiple: true
          path: dist/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download Android APK artifact
        uses: actions/download-artifact@v8
        with:
          name: app-debug.apk
          path: dist/release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate and prepare release files
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          WINDOWS_FILE="$(find dist/release -maxdepth 1 -type f -name 'AXIVESTRA-Setup-*-x64.exe' -print -quit)"
          test -n "$WINDOWS_FILE" || { echo "Windows installer is missing."; exit 1; }
          test -s "$WINDOWS_FILE" || { echo "Windows installer is empty."; exit 1; }
          test -s dist/release/app-debug.apk || { echo "Android APK is missing."; exit 1; }
          mv dist/release/app-debug.apk dist/release/AXIVESTRA-Android.apk
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "WINDOWS_FILE=$WINDOWS_FILE" >> "$GITHUB_ENV"

      - name: Publish a versioned GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving published assets unchanged."
            echo "Bump package.json version to publish a new release."
            exit 0
          fi

          WINDOWS_FILE="$(find dist/release -maxdepth 1 -type f -name 'AXIVESTRA-Setup-*-x64.exe' -print -quit)"
          test -n "$WINDOWS_FILE"
          test -s "$WINDOWS_FILE"
          test -s dist/release/AXIVESTRA-Android.apk
          gh release create "$TAG" \
            "$WINDOWS_FILE" \
            dist/release/AXIVESTRA-Android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "AXIVESTRA $TAG" \
            --generate-notes
