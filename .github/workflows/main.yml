
name: EstateFlow PC and Android builds
# Supabase public client configuration is injected at build time from Actions repository variables.

concurrency:
  group: estateflow-builds-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify Supabase client variables (Windows)
        shell: pwsh
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_URL)) { throw "Missing GitHub Actions variable: VITE_SUPABASE_URL" }
          if ([string]::IsNullOrWhiteSpace($env:VITE_SUPABASE_ANON_KEY)) { throw "Missing GitHub Actions variable: VITE_SUPABASE_ANON_KEY" }
          if (-not $env:VITE_SUPABASE_URL.StartsWith("https://")) { throw "VITE_SUPABASE_URL must be the HTTPS Project URL from Supabase." }
          Write-Host "Both Supabase client variables are present. Values are not printed."
      
      - name: Build Windows EXE
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build && npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer (direct file, no ZIP wrapper)
        uses: actions/upload-artifact@v7
        with:
          name: EstateFlow-Windows
          path: release-dist/*.exe
          archive: false
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Verify Supabase client variables (Android)
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Missing GitHub Actions variable: VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Missing GitHub Actions variable: VITE_SUPABASE_ANON_KEY"; exit 1; }
          case "$VITE_SUPABASE_URL" in https://*) ;; *) echo "::error::VITE_SUPABASE_URL must be the HTTPS Project URL from Supabase."; exit 1 ;; esac
          echo "Both Supabase client variables are present. Values are not printed."
      
      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK (direct file, no ZIP wrapper)
        uses: actions/upload-artifact@v7
        with:
          name: EstateFlow-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
