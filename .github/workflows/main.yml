name: AXIVESTRA Windows and Android builds
# Cloud auth is optional. Only public client configuration is embedded; never pass service-role keys.

concurrency:
  group: axivestra-builds-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AXIVESTRA_WHATSAPP_CLOUD_ENABLED: ${{ vars.VITE_AXIVESTRA_WHATSAPP_CLOUD_ENABLED }}
          VITE_AXIVESTRA_WHATSAPP_WORKER_URL: ${{ vars.VITE_AXIVESTRA_WHATSAPP_WORKER_URL }}
        run: npm run build && npx electron-builder --win nsis --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: AXIVESTRA-Windows
          path: release-dist/*.exe
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_AXIVESTRA_WHATSAPP_CLOUD_ENABLED: ${{ vars.VITE_AXIVESTRA_WHATSAPP_CLOUD_ENABLED }}
          VITE_AXIVESTRA_WHATSAPP_WORKER_URL: ${{ vars.VITE_AXIVESTRA_WHATSAPP_WORKER_URL }}
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Allow trusted local PC companion HTTP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          if "android:usesCleartextTraffic=" not in content:
              content = content.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          manifest.write_text(content, encoding="utf-8")
          PY

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Configure persistent Android release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/axivestra-release.jks
          test -s android/app/axivestra-release.jks
          keytool -list -keystore android/app/axivestra-release.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          gradle = Path("android/app/build.gradle")
          content = gradle.read_text(encoding="utf-8")
          if "signingConfigs {" not in content:
              content, count = re.subn(
                  r"(android\s*\{)",
                  r"""\1
              signingConfigs {
                  release {
                      storeFile file("axivestra-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """,
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not add release signing configuration.")
          content, count = re.subn(
              r"(buildTypes\s*\{\s*release\s*\{)",
              r"\1\n            signingConfig signingConfigs.release",
              content,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not attach the stable signing key.")
          content, count = re.subn(r"(versionCode\s+)\d+", r"\g<1>" + os.environ["ANDROID_VERSION_CODE"], content, count=1)
          if count != 1:
              raise SystemExit("Could not set Android version code.")
          gradle.write_text(content, encoding="utf-8")
          PY

      - name: Build signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Verify signed Android APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload Android debug APK (CI only)
        uses: actions/upload-artifact@v7
        with:
          name: AXIVESTRA-Android-DEBUG-ONLY
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed Android APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: AXIVESTRA-Android-SIGNED
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
