name: EstateFlow Download Builds

on:
  push:
    branches:
      - "feature/estateflow-unified-whatsapp-automation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build app
        run: npm run build
      - name: Package installer without publishing
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Save installer for download
        uses: actions/upload-artifact@v4
        with:
          name: EstateFlow-Windows-Installer
          path: release-dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build app files
        run: npm run build
      - name: Create Android project
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: EstateFlow-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
