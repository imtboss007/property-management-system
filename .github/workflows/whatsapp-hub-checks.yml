name: EstateFlow WhatsApp Hub Checks

on:
  push:
    branches:
      - main
      - "feature/estateflow-unified-whatsapp-automation"
    paths:
      - "services/estateflow-whatsapp-hub/**"
      - "src/**"
      - "electron/whatsapp-service.cjs"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/whatsapp-hub-checks.yml"
  pull_request:
    paths:
      - "services/estateflow-whatsapp-hub/**"
      - ".github/workflows/whatsapp-hub-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/estateflow-whatsapp-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
  estateflow-app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build

