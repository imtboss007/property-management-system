name: AXIVESTRA WhatsApp Hub Checks

on:
  push:
    branches:
      - main
      - "feature/estateflow-unified-whatsapp-automation"
    paths:
      - "services/estateflow-whatsapp-hub/**"
      - "src/**"
      - "electron/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/**"
      - ".env.example"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/whatsapp-hub-checks.yml"
      - ".github/workflows/publish-release.yml"
      - ".github/workflows/main.yml"
  pull_request:
    paths:
      - "services/estateflow-whatsapp-hub/**"
      - "src/**"
      - "electron/**"
      - "package.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/**"
      - ".env.example"
      - ".github/workflows/whatsapp-hub-checks.yml"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contract-check:
    name: Check cloud security contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check company isolation, RBAC and secret-handling contracts
        run: node scripts/security-contract-check.cjs

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/estateflow-whatsapp-hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - name: Check Electron WhatsApp service syntax
        run: node --check electron/main.cjs && node --check electron/whatsapp-service.cjs && node --check electron/preload.cjs
        working-directory: .
  supabase-edge-function-check:
    name: Check Supabase invitation function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install repository npm dependencies for Deno's npm resolver
        run: npm install --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check company invitation function
        run: deno check supabase/functions/invite-company-member/index.ts

  estateflow-app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Test property price/area range search and combined filters
        run: node scripts/property-range-search.test.cjs
      - name: Test WhatsApp phone normalisation and deduplication helper
        run: node scripts/whatsapp-contact-normalization.test.cjs
      - name: Test bidirectional PC/Android sync and deletion protection
        run: node scripts/device-sync.test.cjs
      - run: npm run build

