services:
  anythingllm-mcp-bridge:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    ports:
      # Bind to loopback only; put a TLS reverse proxy in front.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp