<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 270" role="img" aria-labelledby="title desc">
  <title id="title">AXIVESTRA — Asset Intelligence Platform</title>
  <desc id="desc">A metallic silver and electric blue architectural A emblem, followed by the AXIVESTRA wordmark and portfolio intelligence tagline.</desc>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset=".38" stop-color="#0755c8"/><stop offset=".67" stop-color="#1388ff"/><stop offset="1" stop-color="#071a35"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#17d9fa"/><stop offset=".52" stop-color="#2275ff"/><stop offset="1" stop-color="#02c5e8"/></linearGradient>
  </defs>
  <image href="./axivestra-mark.svg" x="0" y="8" width="250" height="250"/>
  <text x="270" y="150" fill="url(#word)" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="900" letter-spacing="1">AXIVESTRA</text>
  <text x="278" y="195" fill="#102239" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600" letter-spacing="7">PROPERTY  ·  FINANCE  ·  INVESTMENTS  ·  LEGAL  ·  OPERATIONS</text>
  <path d="M278 220H1130" stroke="url(#cyan)" stroke-width="2.4" stroke-linecap="round"/>
  <text x="700" y="254" fill="#162c45" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="600" letter-spacing="6">ONE PLATFORM. COMPLETE ASSET LIFECYCLE.</text>
</svg>